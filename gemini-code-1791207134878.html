<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Hỗ trợ CSKH - Viết lại câu an ủi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 font-sans text-gray-800">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-5 md:p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-headset text-blue-600"></i> Hỗ trợ viết câu CS
        </h1>

        <!-- Nhập câu gốc -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">
                <i class="fa-solid fa-pen text-gray-400 mr-1"></i> Câu phản hồi gốc của bạn
            </label>
            <textarea id="originalText" rows="4" class="w-full rounded-xl border border-gray-200 p-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none text-gray-700" placeholder="Ví dụ: Dạ em sẽ báo ngay thông tin này cho phía đơn vị vận chuyển để giục giao hàng ạ"></textarea>
        </div>

        <!-- Chọn tâm trạng -->
        <div class="mb-8">
            <label class="block text-sm font-medium text-gray-700 mb-3">
                <i class="fa-regular fa-face-meh text-gray-400 mr-1"></i> Tâm trạng hiện tại của khách hàng
            </label>
            <div class="flex flex-wrap gap-2" id="moodButtons">
                <button class="mood-btn px-4 py-2 rounded-full border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all text-sm font-medium" data-mood="Nóng giận"><i class="fa-solid fa-fire text-red-500 mr-1"></i> Nóng giận</button>
                <button class="mood-btn px-4 py-2 rounded-full border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all text-sm font-medium" data-mood="Lo lắng"><i class="fa-solid fa-triangle-exclamation text-yellow-500 mr-1"></i> Lo lắng</button>
                <button class="mood-btn px-4 py-2 rounded-full border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all text-sm font-medium" data-mood="Than vãn/Bức xúc"><i class="fa-solid fa-bullhorn text-orange-500 mr-1"></i> Than vãn/Bức xúc</button>
                <button class="mood-btn px-4 py-2 rounded-full border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all text-sm font-medium" data-mood="Thất vọng"><i class="fa-regular fa-face-frown text-purple-500 mr-1"></i> Thất vọng</button>
                <button class="mood-btn px-4 py-2 rounded-full border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all text-sm font-medium" data-mood="Hoang mang/Bối rối"><i class="fa-regular fa-circle-question text-teal-500 mr-1"></i> Hoang mang/Bối rối</button>
                <button class="mood-btn px-4 py-2 rounded-full border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all text-sm font-medium" data-mood="Vui vẻ/Hài lòng"><i class="fa-regular fa-face-smile text-green-500 mr-1"></i> Vui vẻ/Hài lòng</button>
            </div>
        </div>

        <!-- Báo lỗi -->
        <div id="errorBox" class="hidden mb-6 p-4 bg-red-50 text-red-700 rounded-xl border border-red-100 flex items-start gap-3">
            <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
            <span id="errorMessage">Lỗi</span>
        </div>

        <!-- Nút Submit -->
        <button id="rewriteBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 px-4 rounded-xl transition-all shadow-sm flex justify-center items-center gap-2">
            <i class="fa-solid fa-bolt"></i> Viết lại tốc độ cao
        </button>

        <!-- Trạng thái Loading -->
        <div id="loading" class="hidden flex-col items-center justify-center py-8">
            <div class="loader mb-3"></div>
            <p class="text-gray-500 text-sm">Đang tăng tốc xử lý câu...</p>
        </div>

        <!-- Kết quả -->
        <div id="resultsContainer" class="hidden mt-8">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-lg font-semibold text-gray-800">Kết quả gợi ý</h2>
                <button id="regenerateBtn" class="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> Tạo lại
                </button>
            </div>
            <div class="space-y-4" id="resultsList"></div>
        </div>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6JPYEhBcvBLs29muMLky3v4KgqHaKze261Lhy7y6ILaCA";

        const moodButtons = document.querySelectorAll('.mood-btn');
        let selectedMood = '';

        moodButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                moodButtons.forEach(b => {
                    b.classList.remove('bg-blue-50', 'border-blue-300', 'text-blue-700');
                    b.classList.add('text-gray-600', 'border-gray-200');
                });
                btn.classList.add('bg-blue-50', 'border-blue-300', 'text-blue-700');
                btn.classList.remove('text-gray-600', 'border-gray-200');
                selectedMood = btn.getAttribute('data-mood');
            });
        });

        document.getElementById('rewriteBtn').addEventListener('click', () => handleRewrite());
        document.getElementById('regenerateBtn').addEventListener('click', () => handleRewrite());

        async function handleRewrite() {
            const originalText = document.getElementById('originalText').value.trim();
            const errorBox = document.getElementById('errorBox');
            const resultsContainer = document.getElementById('resultsContainer');
            const loading = document.getElementById('loading');
            
            errorBox.classList.add('hidden');
            resultsContainer.classList.add('hidden');

            if (!originalText) {
                showError('Vui lòng nhập câu phản hồi gốc.');
                return;
            }
            if (!selectedMood) {
                showError('Vui lòng chọn tâm trạng hiện tại của khách hàng.');
                return;
            }

            loading.classList.remove('hidden');

            // Prompt rõ ràng cấu trúc mảng để hệ thống phản hồi khớp với JSON
            const prompt = `Khách hàng đang: "${selectedMood}". 
Câu gốc CSKH: "${originalText}". 
Yêu cầu: Viết lại thành 3 phiên bản ngắn gọn để nhắn tin trực tiếp.
ĐỊNH DẠNG BẮT BUỘC (Mảng JSON chứa 3 object):
[
  {"type": "Nhẹ nhàng", "text": "..."},
  {"type": "Chuyên nghiệp", "text": "..."},
  {"type": "Thân thiện", "text": "..."}
]`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "contents": [{"parts":[{"text": prompt}]}],
                        "generationConfig": {
                            "temperature": 0.4,
                            "responseMimeType": "application/json" // Ép buộc chỉ được trả về JSON chuẩn
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`Lỗi API: ${response.status}`);
                }

                const data = await response.json();
                let jsonStr = data.candidates[0].content.parts[0].text;
                
                // Trích xuất mảng JSON an toàn trong trường hợp AI vẫn bọc markdown
                const jsonMatch = jsonStr.match(/\[[\s\S]*\]/);
                if (jsonMatch) {
                    jsonStr = jsonMatch[0];
                }
                
                const results = JSON.parse(jsonStr);
                renderResults(results);
            } catch (error) {
                showError('Đã xảy ra lỗi khi kết nối hoặc xử lý dữ liệu. ' + error.message);
                console.error(error);
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderResults(results) {
            const list = document.getElementById('resultsList');
            list.innerHTML = '';

            results.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white border border-gray-200 p-4 rounded-xl hover:shadow-md transition-shadow relative group';
                card.innerHTML = `
                    <span class="inline-block px-2 py-1 bg-gray-100 text-gray-600 text-xs font-medium rounded mb-2">${item.type}</span>
                    <p class="text-gray-800 leading-relaxed pr-8" id="text-${index}">${item.text}</p>
                    <button onclick="copyText(${index})" class="absolute top-4 right-4 text-gray-400 hover:text-blue-600 transition-colors p-2" title="Sao chép">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                `;
                list.appendChild(card);
            });

            document.getElementById('resultsContainer').classList.remove('hidden');
        }

        function copyText(index) {
            const text = document.getElementById(`text-${index}`).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.currentTarget;
                const icon = btn.querySelector('i');
                icon.className = 'fa-solid fa-check text-green-500';
                setTimeout(() => { icon.className = 'fa-regular fa-copy'; }, 2000);
            });
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            document.getElementById('errorMessage').innerText = msg;
            errorBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
